apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: agentic-chatbot
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/effortless-lock-329115/agentic-chatbot
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: ENVIRONMENT
              value: production
            - name: PORT
              value: "8080"
          resources:
            limits:
              cpu: "2000m"
              memory: "2Gi"
          # Health checks
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
  traffic:
    - percent: 100
      latestRevision: true
