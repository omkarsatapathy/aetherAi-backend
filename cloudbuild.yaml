# Cloud Build configuration for automated deployment
# Features:
# - Docker BuildKit for improved caching
# - Multi-stage builds for layer reuse
# - Kaniko for better layer caching in GCP

options:
  # Use Kaniko for better layer caching
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY

steps:
  # Build the container image with caching
  # Using Kaniko for better layer caching in Cloud Build
  - name: 'gcr.io/kaniko-project/executor:latest'
    args:
      - --destination=gcr.io/$PROJECT_ID/agentic-chatbot:$SHORT_SHA
      - --destination=gcr.io/$PROJECT_ID/agentic-chatbot:latest
      - --cache=true
      - --cache-ttl=168h  # Cache for 7 days
      - --cache-repo=gcr.io/$PROJECT_ID/agentic-chatbot-cache
      - --compressed-caching=false
      - --snapshot-mode=redo
      - --build-arg=BUILDKIT_INLINE_CACHE=1
    timeout: 1200s

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'agentic-chatbot'
      - '--image'
      - 'gcr.io/$PROJECT_ID/agentic-chatbot:$SHORT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '0'
      - '--timeout'
      - '300'
      - '--set-env-vars'
      - 'ENVIRONMENT=production,LOG_LEVEL=WARNING,LOG_TO_FILE=False,LOG_TO_CONSOLE=True,FASTAPI_HOST=0.0.0.0,FASTAPI_PORT=8080'
      # Add your API keys via Secret Manager or set them after deployment:
      # - '--update-secrets=GEMINI_API_KEY=gemini-api-key:latest'
      # - '--update-secrets=GOOGLE_SEARCH_API_KEY=google-search-key:latest'
      - '--cpu-boost'
      - '--no-cpu-throttling'

# Tag both commit SHA and latest
images:
  - 'gcr.io/$PROJECT_ID/agentic-chatbot:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/agentic-chatbot:latest'

# Build timeout
timeout: 2400s
