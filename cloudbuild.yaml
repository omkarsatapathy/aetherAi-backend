# Cloud Build configuration for automated deployment
# Features:
# - Docker BuildKit for improved caching
# - Multi-stage builds for layer reuse
# - Kaniko for better layer caching in GCP

options:
  # Use Kaniko for better layer caching
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _TAG: 'latest'

steps:
  # Step 1: Verify base image is accessible and working
  - name: 'gcr.io/cloud-builders/docker'
    args: ['pull', 'gcr.io/$PROJECT_ID/agentic-chatbot-base:latest']
    timeout: 300s

  # Step 2: Build the container image with caching
  # Using Kaniko for better layer caching in Cloud Build
  # This now uses the pre-built base image, so it only rebuilds code layers (FAST!)
  - name: 'gcr.io/kaniko-project/executor:latest'
    args:
      - --destination=gcr.io/$PROJECT_ID/agentic-chatbot:${_TAG}
      - --destination=gcr.io/$PROJECT_ID/agentic-chatbot:latest
      - --cache=true
      - --cache-ttl=168h  # Cache for 7 days
      - --cache-repo=gcr.io/$PROJECT_ID/agentic-chatbot-cache
      - --dockerfile=Dockerfile
      # Use snapshot-mode=time for faster, incremental builds (like AWS SAM)
      - --snapshot-mode=time
      - --use-new-run=true
      - --compressed-caching=true
    timeout: 1200s

  # Step 3: Verify the built image works (test for llama_index import errors)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        echo "Testing the built image for import errors..."

        # Pull the just-built image
        docker pull gcr.io/$PROJECT_ID/agentic-chatbot:latest

        # Run a quick test to check for llama_index import errors
        timeout 30 docker run --rm gcr.io/$PROJECT_ID/agentic-chatbot:latest \
          python -c "from llama_index.llms.google_genai import GoogleGenAI; print('SUCCESS: llama_index imports work correctly')" || {
          echo "ERROR: Import test failed!"
          exit 1
        }

        echo "Image verification passed!"
    timeout: 120s

  # Step 4: Deploy container image to Cloud Run (only if tests pass)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'agentic-chatbot'
      - '--image'
      - 'gcr.io/$PROJECT_ID/agentic-chatbot:${_TAG}'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '0'
      - '--timeout'
      - '300'
      - '--set-env-vars'
      - 'ENVIRONMENT=production,LOG_LEVEL=WARNING,LOG_TO_FILE=False,LOG_TO_CONSOLE=True,FASTAPI_HOST=0.0.0.0,FASTAPI_PORT=8080'
      # Add your API keys via Secret Manager or set them after deployment:
      # - '--update-secrets=GEMINI_API_KEY=gemini-api-key:latest'
      # - '--update-secrets=GOOGLE_SEARCH_API_KEY=google-search-key:latest'
      - '--cpu-boost'
      - '--no-cpu-throttling'

# Tag both commit SHA and latest
images:
  - 'gcr.io/$PROJECT_ID/agentic-chatbot:${_TAG}'
  - 'gcr.io/$PROJECT_ID/agentic-chatbot:latest'

# Build timeout
timeout: 2400s
